name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "LICENSE", "logo.png"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "logo.png"]
  workflow_dispatch:

jobs:
  lint:
    name: Shell and Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            install.sh install_cert.sh setup-local-dns.sh aliases.bash lib/menu.sh \
            docker-library/php/config_files/docker-php-entrypoint \
            docker-library/php/config_files/xdebug \
            docker-library/httpd/config_files/docker-entrypoint.sh

      - name: the pty driver compiles
        run: python3 -m py_compile .github/scripts/drive-install.py

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker-library/php/Dockerfile
          failure-threshold: error

  install:
    name: Install and serve on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # The installer used to offer databases it could not name: the list came from
      # `docker compose config --profiles`, which cannot parse the files before .env
      # exists. The same command validated the answer, so a correct name was dropped
      # too. Runs before the real install, in the no-.env state the bug needed.
      - name: the installer can name the databases it offers
        run: |
          set -euo pipefail
          # Must run before 'compose file parses' does cp .env.example .env:
          # the bug needs the fresh-clone state, with no .env at all.
          if [ -f .env ]; then
            echo "this step has to run before anything creates .env"; exit 1
          fi

          # The regression test. An empty list is what broke both halves: nothing
          # to read, and nothing to validate against. --yes answers `none`, so the
          # typed path itself needs a tty and stays uncovered until task 33
          # reworks the prompts.
          ./install.sh --yes --skip-dns --skip-cert --skip-link | tee /tmp/install.log
          grep -q 'pg18' /tmp/install.log
          grep -q 'mariadb12' /tmp/install.log
          rm -f .env

          # Guards the new validation against becoming too strict. It does not
          # reproduce the bug: --profiles bypassed validation entirely, so this
          # passed even while every typed name was being rejected.
          ./install.sh --yes --skip-dns --skip-cert --skip-link --profiles=pg18,mail >/dev/null
          grep -q '^COMPOSE_PROFILES=pg18,mail$' .env
          rm -f .env .env.backup

          # a name that does not must stop a scripted install, not write a dead profile
          if ./install.sh --yes --skip-dns --skip-cert --skip-link --profiles=nope >/dev/null 2>&1; then
            echo "unknown profile was accepted"; exit 1
          fi
          test ! -f .env
          echo "the offered list is real and answerable"

      # Task 32 shipped a broken prompt because CI only ever ran --yes, where the
      # questions are never asked. This presses the keys a person presses: a pty,
      # arrow/digit keys, space to toggle. The driver finds each option by reading
      # the drawn menu, so adding a database cannot quietly break it.
      - name: the menus answer real keystrokes
        run: |
          set -euo pipefail
          rm -f .env .env.backup
          python3 .github/scripts/drive-install.py \
            ./install.sh --skip-cert --skip-dns --skip-link --domain=phpforge.dev
          grep -q '^PHP_VERSION=85$' .env          # moved off the default 8.4
          grep -q '^IMAGE_MODE=missing$' .env      # kept 'pull'
          grep -q '^COMPOSE_PROFILES=pg18,mail$' .env
          rm -f .env .env.backup
          echo "the menus work end to end"

      - name: compose file parses
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          # Optional services live behind profiles instead of being commented
          # out, so they stay parsed and cannot rot unnoticed the way the old
          # nginx block did.
          docker compose --profile search --profile tools config >/dev/null
          echo "default services:"
          docker compose config --services
          echo "with every profile:"
          docker compose --profile search --profile tools config --services

      - name: profiles do not leak into the default set
        run: |
          for s in es8143dev kibana mkcert; do
            if docker compose config --services | grep -qx "$s"; then
              echo "$s starts by default and should not"; exit 1
            fi
          done
          echo "optional services stay optional"

      # --skip-dns: the runner's resolver is left alone; curl --resolve is used
      # instead. Certificates are not skipped, so real TLS is exercised.
      - name: run the installer
        run: ./install.sh --yes --skip-dns

      - name: .env was written
        run: |
          grep -q '^PROJECTS_DIR=' .env
          grep -q "^PUID=$(id -u)$" .env
          grep -q "^PGID=$(id -g)$" .env

      # forge is the documented entry point now, so it gets exercised rather than
      # only its README examples.
      - name: the forge command works
        run: |
          test -L "$HOME/.local/bin/forge" || { echo "installer did not link forge"; exit 1; }
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp    # it must work from anywhere, not just the checkout
          forge help | grep -q "8.3 8.4 8.5" || { echo "versions not discovered"; exit 1; }
          forge status | grep -q "PHP DevForge"
          forge images status
          # unknown versions must be refused, not passed to docker
          if forge use 9.9 2>/dev/null; then echo "9.9 should have been rejected"; exit 1; fi

      - name: build images
        # Every PHP version is built. 8.5 broke silently once: opcache became
        # built-in and docker-php-ext-install started failing on it.
        run: docker compose build php83dev php84dev php85dev apachedev

      - name: start the stack
        run: |
          docker compose up -d apachedev php83dev php84dev php85dev
          docker compose ps
          # "running" only means the process started. The PHP entrypoints still
          # have setup to finish, and Apache serves in parallel, so wait for an
          # actual answer instead.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
                 https://welcome--sites.phpforge.dev/ >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "still not serving after 60s"
          docker compose logs --tail=30
          exit 1

      - name: create a project with a hyphen in its name
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          mkdir -p "$DIR/projects/my-app/public"
          printf '<?php echo "my-app on PHP ".PHP_VERSION."\\n";' \
            > "$DIR/projects/my-app/public/index.php"
          ln -sfn ../projects/my-app/public "$DIR/sites/my-app"

      - name: diagnostics
        if: failure()
        run: |
          echo "--- PROJECTS_DIR in .env ---"
          grep '^PROJECTS_DIR=' .env
          echo "--- mount as compose resolves it ---"
          docker compose config | grep -A3 'public_html' | head -12
          echo "--- on the host ---"
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          ls -la "$DIR" "$DIR/sites" "$DIR/sites/welcome" 2>&1 | head -30
          echo "--- inside apachedev ---"
          docker compose exec -T apachedev ls -la /home/php-devforge/ /home/php-devforge/public_html/ 2>&1 | head -20
          echo "--- DEV_DOMAIN inside apachedev ---"
          docker compose exec -T apachedev printenv DEV_DOMAIN PHP_VERSION
          echo "--- what the response actually is ---"
          curl -sv --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/ 2>&1 | tail -25

      - name: the welcome page is served over HTTPS
        run: |
          curl -fsS --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/ | tee /tmp/welcome.txt
          grep -q "PHP DevForge is running" /tmp/welcome.txt

      # Hyphens in project names were broken for a long time: mi-app--sites
      # resolved to sites/app/mi.
      - name: a hyphenated project name resolves
        run: |
          curl -fsS --resolve my-app--sites.phpforge.dev:443:127.0.0.1 \
            https://my-app--sites.phpforge.dev/ | tee /tmp/app.txt
          grep -q "my-app on PHP 8.4" /tmp/app.txt

      - name: the URL suffix selects the PHP version
        run: |
          for v in 83 84 85; do
            host="my-app--sites--p${v}.phpforge.dev"
            got="$(curl -fsS --resolve "$host:443:127.0.0.1" "https://$host/")"
            echo "$got"
            printf '%s' "$got" | grep -q "PHP ${v:0:1}.${v:1:1}" \
              || { echo "expected PHP ${v:0:1}.${v:1:1}"; exit 1; }
          done

      # Neither is installed by us any more: the base images already provide them.
      # If that ever stops being true, this catches it instead of a user finding out.
      - name: opcache and mbstring are present in every version
        run: |
          for s in php83dev php84dev php85dev; do
            got="$(docker compose exec -T "$s" php -r 'echo extension_loaded("Zend OPcache") && extension_loaded("mbstring") ? "yes" : "no";')"
            test "$got" = "yes" || { echo "$s: opcache or mbstring missing"; exit 1; }
            len="$(docker compose exec -T "$s" php -r 'echo mb_strlen("ñandú");')"
            test "$len" = "5" || { echo "$s: mbstring not working (got $len)"; exit 1; }
            echo "$s ok"
          done

      # This one leaked source for every request that did not go through
      # DirectoryIndex. Guard it so it cannot come back.
      - name: PHP source is never served as text
        run: |
          for host in my-app--sites my-app--sites--p83 my-app--sites--p99; do
            body="$(curl -sk --resolve $host.phpforge.dev:443:127.0.0.1 \
              https://$host.phpforge.dev/index.php || true)"
            if printf '%s' "$body" | grep -q '<?php'; then
              echo "SOURCE LEAK on $host"; exit 1
            fi
          done
          body="$(curl -s http://127.0.0.1/index.php -H 'Host: my-app--sites.phpforge.dev' || true)"
          printf '%s' "$body" | grep -q '<?php' && { echo "SOURCE LEAK over plain HTTP"; exit 1; }
          echo "no leaks"

      # Files written by the container must belong to the host user, or
      # node_modules cannot be deleted without sudo.
      - name: files created in the container belong to the host user
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php file_put_contents(__DIR__."/written.txt","x");' \
            > "$DIR/projects/my-app/public/write.php"
          curl -fsS --resolve my-app--sites.phpforge.dev:443:127.0.0.1 \
            https://my-app--sites.phpforge.dev/write.php >/dev/null
          owner="$(stat -c %u "$DIR/projects/my-app/public/written.txt")"
          test "$owner" = "$(id -u)" || { echo "owned by $owner, expected $(id -u)"; exit 1; }
          rm -f "$DIR/projects/my-app/public/written.txt"

      # sites/ is a shortcut tried before the full path, and both must keep working.
      - name: short and full paths both resolve
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          forge link "$DIR/projects/my-app/public"
          mkdir -p "$DIR/sites/api/v2"
          printf '<?php echo "nested ok";' > "$DIR/sites/api/v2/index.php"
          get() { curl -fsS -k --resolve "$1.phpforge.dev:443:127.0.0.1" "https://$1.phpforge.dev/"; }
          get my-app                   | grep -q "my-app on PHP"   # sites/ shortcut
          get v2--api                  | grep -q "nested ok"       # nested under sites/
          get public--my-app--projects | grep -q "my-app on PHP"   # full path still works
          get my-app--sites            | grep -q "my-app on PHP"   # long form still works
          # forge link must produce a relative link: an absolute one resolves on the
          # runner but points at nothing inside the containers.
          case "$(readlink "$DIR/sites/my-app")" in
            /*) echo "link is absolute; it will 404 inside the containers"; exit 1 ;;
          esac
          # and it must refuse a folder the containers cannot see
          if forge link /tmp 2>/dev/null; then echo "should have refused /tmp"; exit 1; fi

      # Apache does not forward the Authorization header to FastCGI by itself;
      # php-fpm.conf adds it back. Removing that line breaks every Bearer token
      # and JWT silently, with nothing else looking wrong.
      - name: the Authorization header reaches PHP
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php echo $_SERVER["HTTP_AUTHORIZATION"] ?? "MISSING";' \
            > "$DIR/sites/welcome/auth.php"
          got="$(curl -fsS -H 'Authorization: Bearer ci-token' \
            --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/auth.php)"
          test "$got" = "Bearer ci-token" || { echo "got '$got'"; exit 1; }

      - name: hidden .php files are not served
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php echo "should not be reachable";' > "$DIR/sites/welcome/.php"
          code="$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/.php)"
          rm -f "$DIR/sites/welcome/.php"
          test "$code" = "403" || { echo "expected 403, got $code"; exit 1; }

      # Everything above proves the stack works, using curl --resolve. From here
      # the system resolver is configured for real, so a failure below points at
      # setup-local-dns.sh and nothing else.
      - name: configure the system DNS
        run: |
          ./setup-local-dns.sh
          ./setup-local-dns.sh --status

      - name: the domain resolves through the system resolver
        run: |
          got="$(getent hosts welcome--sites.phpforge.dev | awk '{print $1}')"
          test "$got" = "127.0.0.1" || { echo "got '$got', expected 127.0.0.1"; exit 1; }
          # A wildcard, so any subdomain must work without being listed anywhere.
          got="$(getent hosts anything--at--all.phpforge.dev | awk '{print $1}')"
          test "$got" = "127.0.0.1" || { echo "wildcard failed: '$got'"; exit 1; }

      - name: the rest of DNS is untouched
        run: |
          for h in github.com debian.org; do
            got="$(getent hosts $h | awk '{print $1; exit}')"
            test -n "$got" || { echo "$h does not resolve"; exit 1; }
            echo "$h -> $got"
          done

      # The old script wrote Domains=~., sending every query on the machine
      # through the container. Stopping the stack then killed all DNS.
      - name: internet still works with dnsmasq stopped
        run: |
          docker compose stop dnsmasq
          sudo resolvectl flush-caches || true
          for h in github.com debian.org; do
            got="$(getent hosts $h | awk '{print $1; exit}')"
            test -n "$got" || { echo "FAIL: $h stopped resolving"; exit 1; }
          done
          echo "internet survived"
          docker compose start dnsmasq
          sleep 3

      # No --resolve here: this is the path a browser actually takes.
      - name: serve over the real DNS path
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 5 https://welcome--sites.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS https://welcome--sites.phpforge.dev/ | grep -q "PHP DevForge is running"
          curl -fsS https://my-app--sites.phpforge.dev/ | grep -q "my-app on PHP 8.4"
          curl -fsS https://my-app--sites--p83.phpforge.dev/ | grep -q "PHP 8.3"

      - name: --remove undoes it, with .env already gone
        run: |
          # The cleanup order people actually use: delete .env, then undo the DNS
          # change. Removal must not need config that is already gone.
          mv .env /tmp/env.bak
          ./setup-local-dns.sh --remove
          mv /tmp/env.bak .env
          test ! -f /etc/systemd/resolved.conf.d/50-php-devforge.conf
          getent hosts github.com >/dev/null || { echo "DNS broken after removal"; exit 1; }
          echo "clean"

      # Databases and mail are only useful if PHP can actually reach them, which is
      # a shared-network question rather than a compose-syntax one.
      - name: databases and mail are reachable from PHP
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          forge db on pg18
          forge db on mariadb12
          forge mail on
          # Wait for the thing we actually need -- a connection from PHP with the real
          # credentials -- not for a readiness proxy. `mariadb-admin ping` answers on
          # the local socket seconds before the server accepts TCP connections and
          # before the init scripts have created the user, so it reports "alive" while
          # PDO still gets ECONNREFUSED. Same trap as "container running" earlier.
          for i in $(seq 1 60); do
            if docker compose exec -T php84dev php -r '
                 $u = getenv("USER_DEV") ?: "php-devforge"; $p = "php-devforge01";
                 new PDO("pgsql:host=postgres18dev;port=5432;dbname=$u", $u, $p);
                 new PDO("mysql:host=mariadb12dev;port=3306;dbname=$u", $u, $p);' 2>/dev/null; then
              echo "both databases reachable after ${i}s"
              break
            fi
            [ "$i" = 60 ] && { echo "databases never became reachable"; docker compose logs --tail=40 mariadb12dev postgres18dev; exit 1; }
            sleep 2
          done
          # Mail: sent over SMTP from PHP, read back through the web UI.
          docker compose exec -T php84dev php -r '
            $s = fsockopen("mailpit", 1025, $e, $es, 5) or exit(1);
            fgets($s);
            foreach (["EHLO ci","MAIL FROM:<a@ci.test>","RCPT TO:<b@ci.test>","DATA"] as $c) {
                fwrite($s, "$c\r\n"); fgets($s);
            }
            fwrite($s, "Subject: ci-probe\r\n\r\nbody\r\n.\r\n"); fgets($s);
            fwrite($s, "QUIT\r\n");'
          sleep 3
          curl -fsS -k --resolve mail.phpforge.dev:443:127.0.0.1 \
            "https://mail.phpforge.dev/api/v1/messages?limit=5" | grep -q ci-probe
          echo "mail captured and served at mail.<domain>"

      # nginx sat commented out and broken since the first commit precisely because
      # nothing exercised it. It is an alternative to Apache, not an addition: both
      # want ports 80 and 443.
      - name: the nginx variant serves the same sites
        run: |
          docker compose build nginxdev
          docker compose stop apachedev
          docker compose --profile nginx up -d nginxdev
          for i in $(seq 1 30); do
            curl -fsS --max-time 5 -k --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
              https://welcome--sites.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          get() { curl -fsS -k --resolve "$1.phpforge.dev:443:127.0.0.1" "https://$1.phpforge.dev/"; }
          get my-app--sites          | grep -q "PHP 8.4"
          get my-app--sites--p83     | grep -q "PHP 8.3"
          get my-app--sites--p85     | grep -q "PHP 8.5"
          # The Lua sets an unroutable backend when it cannot work out a version, so a
          # .php fails closed instead of being served as a static file.
          for h in my-app--sites my-app--sites--p99; do
            body="$(curl -sk --resolve "$h.phpforge.dev:443:127.0.0.1" "https://$h.phpforge.dev/index.php" || true)"
            printf '%s' "$body" | grep -q '<?php' && { echo "SOURCE LEAK on $h"; exit 1; }
          done
          echo "nginx ok"
          docker compose stop nginxdev
          docker compose up -d apachedev

      - name: container logs on failure
        if: failure()
        run: docker compose logs --tail=50
