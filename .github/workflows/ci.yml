name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "LICENSE", "logo.png"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "logo.png"]
  workflow_dispatch:

jobs:
  lint:
    name: Shell and Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            install.sh install_cert.sh setup-local-dns.sh aliases.bash \
            lib/menu.sh lib/compose.sh lib/version.sh lib/skill.sh \
            .github/scripts/serve.sh \
            uninstall.sh bin/forge \
            docker-library/nginx/config_files/docker-entrypoint.sh \
            docker-library/php/config_files/docker-php-entrypoint \
            docker-library/php/config_files/xdebug \
            docker-library/httpd/config_files/docker-entrypoint.sh

      # `forge` exists so the common commands are one word; a README that teaches
      # `docker compose up` instead is how it stayed undiscovered until someone
      # installed the project and never found `forge help`. Prose about what CI
      # validates may still say `docker compose config` -- that is not an instruction.
      - name: the READMEs do not teach docker compose
        run: |
          fail=0
          for pattern in 'docker compose up' 'docker compose logs' \
                         'docker compose stop' 'docker compose --profile' \
                         'docker compose build'; do
            if grep -n "$pattern" README.md README.es.md; then
              echo "^ use the forge command instead"; fail=1
            fi
          done
          exit $fail

      # A version people can quote is only useful if it cannot drift from the tag
      # the release was cut at.
      - name: the version file and the tag agree
        run: |
          v="$(cat VERSION)"
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "VERSION is not semver: '$v'"; exit 1; }

          tag="$(git tag --points-at HEAD | grep '^v' | head -1 || true)"
          if [ -n "$tag" ] && [ "$tag" != "v$v" ]; then
            echo "tagged $tag but VERSION says $v"; exit 1
          fi
          test -n "$tag" && echo "released as $tag" || echo "$v, untagged commit"

      # The skill is hooked into agent config that belongs to the user, so the
      # two things that matter are that a second run does not duplicate it and
      # that turning it off gives the file back exactly as it was.
      - name: the agent skill hooks up and comes back off
        run: |
          grep -qx -- '---' <<<"$(head -1 skills/php-devforge/SKILL.md)" \
            || { echo "SKILL.md has no frontmatter"; exit 1; }
          grep -qx 'name: php-devforge' skills/php-devforge/SKILL.md \
            || { echo "SKILL.md declares no name"; exit 1; }

          H="$(mktemp -d)"
          mkdir -p "$H/.claude" "$H/.codex" "$H/.config/opencode"
          printf '# My rules\n\nAlways use tabs.\n' > "$H/.codex/AGENTS.md"
          cp "$H/.codex/AGENTS.md" "$H/before.md"

          # No .gemini here: an agent that is not installed must not have a
          # config home invented for it.
          run() { env HOME="$H" XDG_CONFIG_HOME="$H/.config" ./bin/forge "$@"; }

          run skill on
          grep -q '^  gemini' <<<"$(run skill status)" && { echo "invented ~/.gemini"; exit 1; }
          test -f "$H/.claude/skills/php-devforge/SKILL.md" \
            || { echo "the claude symlink does not resolve"; exit 1; }
          grep -q 'PHP DevForge' "$H/.config/opencode/AGENTS.md" \
            || { echo "opencode got no block"; exit 1; }

          run skill on >/dev/null
          n="$(grep -c 'php-devforge:start' "$H/.codex/AGENTS.md")"
          test "$n" = "1" || { echo "the block appears $n times"; exit 1; }

          # Rules written after our block: removing ours must leave theirs, and
          # the blank line we inserted has to come back out with it.
          printf '\n# Later rules\n' >> "$H/.codex/AGENTS.md"
          { cat "$H/before.md"; printf '\n# Later rules\n'; } > "$H/expected.md"

          run skill off
          cmp "$H/.codex/AGENTS.md" "$H/expected.md" \
            || { echo "the user's own file came back changed"; exit 1; }
          test ! -e "$H/.config/opencode/AGENTS.md" \
            || { echo "a file we created was left behind"; exit 1; }
          test ! -e "$H/.claude/skills/php-devforge" \
            || { echo "the symlink was left behind"; exit 1; }
          rm -rf "$H"

      - name: the helper scripts compile
        run: |
          python3 -m py_compile .github/scripts/drive-install.py
          python3 -m py_compile .github/scripts/run-step.py

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker-library/php/Dockerfile
          failure-threshold: error

  install:
    name: Install and serve on a clean machine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # The installer used to offer databases it could not name: the list came from
      # `docker compose config --profiles`, which cannot parse the files before .env
      # exists. The same command validated the answer, so a correct name was dropped
      # too. Runs before the real install, in the no-.env state the bug needed.
      - name: the installer can name the databases it offers
        run: |
          set -euo pipefail
          # Must run before 'compose file parses' does cp .env.example .env:
          # the bug needs the fresh-clone state, with no .env at all.
          if [ -f .env ]; then
            echo "this step has to run before anything creates .env"; exit 1
          fi

          # The regression test. An empty list is what broke both halves: nothing
          # to read, and nothing to validate against. --yes answers `none`, so the
          # typed path itself needs a tty and stays uncovered until task 33
          # reworks the prompts.
          ./install.sh --yes --skip-dns --skip-cert --skip-link | tee /tmp/install.log
          grep -q 'pg18' /tmp/install.log
          grep -q 'mariadb12' /tmp/install.log
          rm -f .env

          # Guards the new validation against becoming too strict. It does not
          # reproduce the bug: --profiles bypassed validation entirely, so this
          # passed even while every typed name was being rejected.
          ./install.sh --yes --skip-dns --skip-cert --skip-link --profiles=pg18,mail >/dev/null
          # The default PHP version leads the line: versions are profiles too.
          grep -q '^COMPOSE_PROFILES=php84,pg18,mail$' .env
          rm -f .env .env.backup

          # a name that does not must stop a scripted install, not write a dead profile
          if ./install.sh --yes --skip-dns --skip-cert --skip-link --profiles=nope >/dev/null 2>&1; then
            echo "unknown profile was accepted"; exit 1
          fi
          test ! -f .env
          echo "the offered list is real and answerable"

      # Task 32 shipped a broken prompt because CI only ever ran --yes, where the
      # questions are never asked. This presses the keys a person presses: a pty,
      # arrow/digit keys, space to toggle. The driver finds each option by reading
      # the drawn menu, so adding a database cannot quietly break it.
      - name: the menus answer real keystrokes
        run: |
          set -euo pipefail
          rm -f .env .env.backup
          python3 .github/scripts/drive-install.py \
            ./install.sh --skip-cert --skip-dns --skip-link --domain=phpforge.dev
          grep -q '^PHP_VERSION=85$' .env          # moved off the default 8.4
          grep -q '^IMAGE_MODE=missing$' .env      # kept 'pull'
          # 8.4 was toggled off and 8.3/8.5 on, so the versions are a choice and
          # the second question decided which of them answers a plain host name.
          grep -q '^COMPOSE_PROFILES=php83,php85,pg18,mail$' .env
          rm -f .env .env.backup
          echo "the menus work end to end"

      - name: compose file parses
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          # Optional services live behind profiles instead of being commented
          # out, so they stay parsed and cannot rot unnoticed the way the old
          # nginx block did.
          docker compose --profile search --profile tools config >/dev/null
          echo "default services:"
          docker compose config --services
          echo "with every profile:"
          docker compose --profile search --profile tools config --services

      - name: profiles do not leak into the default set
        run: |
          for s in es8143dev kibana mkcert; do
            if docker compose config --services | grep -qx "$s"; then
              echo "$s starts by default and should not"; exit 1
            fi
          done
          echo "optional services stay optional"

      # --skip-dns: the runner's resolver is left alone; curl --resolve is used
      # instead. Certificates are not skipped, so real TLS is exercised.
      - name: run the installer
        run: ./install.sh --yes --skip-dns --php=84

      # Every version used to be installed whether or not you wanted it: 1.9 GB
      # each. What is not picked must not reach the default set at all.
      - name: only the PHP versions you picked are installed
        run: |
          # Not an exact match on the line: --yes also accepts the mail catcher.
          grep -qE '^COMPOSE_PROFILES=php84(,|$)' .env \
            || { grep '^COMPOSE_PROFILES=' .env; exit 1; }
          if grep '^COMPOSE_PROFILES=' .env | grep -qE 'php(83|85)'; then
            echo "a version nobody asked for was enabled"
            grep '^COMPOSE_PROFILES=' .env; exit 1
          fi
          for s in php83dev php85dev; do
            if docker compose config --services | grep -qx "$s"; then
              echo "$s starts by default and should not"; exit 1
            fi
          done
          docker compose config --services | grep -qx php84dev
          echo "one version picked, one version installed"

      # A re-run used to move the default to the lowest version picked, because
      # the second question defaulted to the head of the list instead of to what
      # .env already said. Caught reinstalling this machine after an uninstall.
      - name: re-running the installer does not move the default
        run: |
          # The state `forge php on 8.3` leaves: the versions are sorted, so the
          # first one is not the default. That is what used to move it.
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=php83,php84/' .env
          sed -i 's/^PHP_VERSION=.*/PHP_VERSION=84/' .env

          ./install.sh --yes --skip-dns --skip-cert --skip-link >/dev/null
          grep -q '^PHP_VERSION=84$' .env \
            || { grep '^PHP_VERSION=' .env; echo "the default moved"; exit 1; }
          grep -q '^COMPOSE_PROFILES=php83,php84' .env \
            || { grep '^COMPOSE_PROFILES=' .env; echo "it dropped a version"; exit 1; }

          # back to the one version the next steps expect
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=php84/' .env
          echo "the default stays where you put it"

      - name: .env was written
        run: |
          grep -q '^PROJECTS_DIR=' .env
          grep -q "^PUID=$(id -u)$" .env
          grep -q "^PGID=$(id -g)$" .env

      # forge is the documented entry point now, so it gets exercised rather than
      # only its README examples.
      - name: the forge command works
        run: |
          test -L "$HOME/.local/bin/forge" || { echo "installer did not link forge"; exit 1; }
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp    # it must work from anywhere, not just the checkout
          forge help | grep -q "out of 8.3, 8.4, 8.5" || { echo "versions not discovered"; exit 1; }
          forge status | grep -q "PHP DevForge"
          forge images status
          # unknown versions must be refused, not passed to docker
          if forge use 9.9 2>/dev/null; then echo "9.9 should have been rejected"; exit 1; fi


      - name: build images
        # Every PHP version is built. 8.5 broke silently once: opcache became
        # built-in and docker-php-ext-install started failing on it.
        run: docker compose build php83dev php84dev php85dev apachedev

      # The rest of the run needs all three. Adding them through forge rather than
      # by naming services proves the command people are told to use, and keeps
      # .env and the containers agreeing -- Apache reads COMPOSE_PROFILES to know
      # what exists.
      - name: forge php on adds a version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          forge php on 8.3
          forge php on 8.5
          for v in 83 84 85; do
            grep -q "^COMPOSE_PROFILES=.*php$v" .env || { grep '^COMPOSE_PROFILES=' .env; exit 1; }
          done
          forge php list | grep -qE '^\s+8\.4\s+ON\s+default'
          echo "versions added"

      - name: start the stack
        run: |
          docker compose up -d apachedev php83dev php84dev php85dev
          docker compose ps
          # "running" only means the process started. The PHP entrypoints still
          # have setup to finish, and Apache serves in parallel, so wait for an
          # actual answer instead.
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
                 https://welcome--sites.phpforge.dev/ >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "still not serving after 60s"
          docker compose logs --tail=30
          exit 1

      - name: create a project with a hyphen in its name
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          mkdir -p "$DIR/projects/my-app/public"
          printf '<?php echo "my-app on PHP ".PHP_VERSION."\\n";' \
            > "$DIR/projects/my-app/public/index.php"
          ln -sfn ../projects/my-app/public "$DIR/sites/my-app"

      # A container reporting healthy while HTTPS answers nothing is worse than
      # no healthcheck at all: it is the line that made a failed run unreadable.
      - name: the healthcheck tests HTTPS, not just port 80
        run: |
          probe="$(docker inspect --format '{{json .Config.Healthcheck.Test}}' apachedev)"
          case "$probe" in
            *https://localhost*) ;;
            *) echo "the healthcheck never touches 443: $probe"; exit 1 ;;
          esac

          state=""
          for _ in $(seq 1 90); do
            state="$(docker inspect --format '{{.State.Health.Status}}' apachedev)"
            [ "$state" = healthy ] && break
            sleep 1
          done
          test "$state" = healthy || {
            echo "apachedev never became healthy: $state"
            docker inspect --format '{{json .State.Health}}' apachedev
            exit 1
          }

          # docker keeps every probe's output in the health log, and the welcome
          # page is five kilobytes of it. -o /dev/null keeps it readable.
          out="$(docker inspect --format '{{(index .State.Health.Log 0).Output}}' apachedev)"
          test -z "$out" || { echo "the probe logged a page body: $out"; exit 1; }
          echo "healthy over both ports, quietly"

      - name: diagnostics
        if: failure()
        run: |
          echo "--- PROJECTS_DIR in .env ---"
          grep '^PROJECTS_DIR=' .env
          echo "--- mount as compose resolves it ---"
          docker compose config | grep -A3 'public_html' | head -12
          echo "--- on the host ---"
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          ls -la "$DIR" "$DIR/sites" "$DIR/sites/welcome" 2>&1 | head -30
          echo "--- inside apachedev ---"
          docker compose exec -T apachedev ls -la /home/php-devforge/ /home/php-devforge/public_html/ 2>&1 | head -20
          echo "--- DEV_DOMAIN inside apachedev ---"
          docker compose exec -T apachedev printenv DEV_DOMAIN PHP_VERSION
          echo "--- what the response actually is ---"
          curl -sv --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/ 2>&1 | tail -25

      - name: the welcome page is served over HTTPS
        run: |
          fetch() {
            curl -fsS --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
              https://welcome--sites.phpforge.dev/ > /tmp/welcome.txt
          }
          fetch
          grep -q "PHP DevForge is running" /tmp/welcome.txt

          # The previous step waits for the default version to answer; the other
          # two are containers that have started but whose entrypoint may not have
          # reached php-fpm yet. The page probes port 9000, so it reports them as
          # down until they listen -- correctly. Wait for the state being asserted.
          for _ in $(seq 1 30); do
            grep -q -- '--p83' /tmp/welcome.txt \
              && grep -q -- '--p84' /tmp/welcome.txt \
              && grep -q -- '--p85' /tmp/welcome.txt && break
            sleep 1
            fetch
          done

          # It reports the request it is answering, so a wrong backend shows up here
          grep -q "$(docker compose exec -T php84dev php -r 'echo PHP_VERSION;')" /tmp/welcome.txt \
            || { echo "the page does not name the PHP version serving it"; exit 1; }
          grep -q 'Apache' /tmp/welcome.txt || { echo "it does not say who served it"; exit 1; }

          # The logo travels with the page, so it works with no network
          code="$(curl -fsS -o /dev/null -w '%{http_code}' \
                  --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
                  https://welcome--sites.phpforge.dev/logo.png)"
          test "$code" = 200 || { echo "logo.png: $code"; exit 1; }

          # The panel is probed, not decorated. What is true right here: the three
          # PHP containers are up (the previous step named them), and nothing has
          # started Elasticsearch. Mail is enabled in .env but not running yet --
          # asserted where it is started, further down.
          for v in 83 84 85; do
            grep -q -- "--p$v" /tmp/welcome.txt \
              || { echo "php${v}dev is up but the page does not link it"; exit 1; }
          done
          grep -q 'forge profile list' /tmp/welcome.txt
          if grep -q 'es8143dev:9200' /tmp/welcome.txt; then
            echo "it claims Elasticsearch is up, and nothing started it"; exit 1
          fi
          echo "the welcome page reports what is actually running"

      # Hyphens in project names were broken for a long time: mi-app--sites
      # resolved to sites/app/mi.
      # Needs running containers, so it sits after the page is confirmed served
      # rather than with the other forge checks, which run before the stack is up.
      - name: forge logs reaches every container
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Counting distinct services, not looking for one name: compose prints
          # logs for stopped containers too, so "apachedev appears" would pass even
          # if the command had regressed to following a single container.
          named() { grep -oE '^[a-z0-9]+ *\|' "$1" | tr -d ' |' | sort -u; }

          timeout 5 forge logs > /tmp/all.log 2>&1 || true
          all="$(named /tmp/all.log | wc -l)"
          test "$all" -ge 3 || { echo "forge logs named $all services, expected the stack"; exit 1; }

          # naming one narrows it to exactly that -- a service, not just a PHP
          # version, which is what sent the README to `docker compose logs`
          timeout 5 forge logs apachedev > /tmp/one.log 2>&1 || true
          test "$(named /tmp/one.log)" = apachedev || {
            echo "forge logs apachedev named: $(named /tmp/one.log | tr '\n' ' ')"; exit 1; }

          if forge logs nope 2>/dev/null; then echo "unknown service accepted"; exit 1; fi
          echo "forge logs: $all services with no argument, one when named"

      - name: a hyphenated project name resolves
        run: |
          curl -fsS --resolve my-app--sites.phpforge.dev:443:127.0.0.1 \
            https://my-app--sites.phpforge.dev/ | tee /tmp/app.txt
          grep -q "my-app on PHP 8.4" /tmp/app.txt

      - name: the URL suffix selects the PHP version
        run: |
          for v in 83 84 85; do
            host="my-app--sites--p${v}.phpforge.dev"
            got="$(curl -fsS --resolve "$host:443:127.0.0.1" "https://$host/")"
            echo "$got"
            printf '%s' "$got" | grep -q "PHP ${v:0:1}.${v:1:1}" \
              || { echo "expected PHP ${v:0:1}.${v:1:1}"; exit 1; }
          done

      # A version that is not installed used to proxy to a host that does not
      # resolve: a bare 503, indistinguishable from a typo. The trap puts 8.3 back
      # however this ends, because every step after this one uses it.
      - name: an uninstalled version says so instead of failing blankly
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          trap 'forge php on 8.3 >/dev/null 2>&1 || true' EXIT

          # the default cannot be removed: nothing would answer a plain host name
          out="$(forge php off 8.4 2>&1)" && { echo "removing the default was allowed"; exit 1; }
          printf '%s\n' "$out" | grep -q 'forge use' || { echo "$out"; exit 1; }

          forge php off 8.3
          docker compose ps --services | grep -qx php83dev \
            && { echo "php83dev still running"; exit 1; }

          host=my-app--sites--p83.phpforge.dev
          code="$(curl -sk -o /tmp/gone.html -w '%{http_code}' \
                  --resolve "$host:443:127.0.0.1" "https://$host/")"
          test "$code" = 503 || { echo "expected 503, got $code"; exit 1; }
          # "/" reaches PHP through DirectoryIndex, which is where an earlier
          # version of this page was swallowed and served as an empty 200.
          grep -q 'PHP 8.3 is not installed' /tmp/gone.html || { cat /tmp/gone.html; exit 1; }
          grep -q 'forge php on 8.3' /tmp/gone.html || { cat /tmp/gone.html; exit 1; }
          echo "it explains itself"

          forge php on 8.3
          # -k here only: TLS trust is what several other steps are for, and this
          # way the step also runs on a machine that skipped ./install_cert.sh.
          for i in $(seq 1 30); do
            curl -fsSk --max-time 5 --resolve "$host:443:127.0.0.1" "https://$host/" \
              | grep -q 'PHP 8.3' && { echo "8.3 serves again after ${i}s"; exit 0; }
            sleep 1
          done
          echo "8.3 never came back"; exit 1

      # Upgrading is a git pull, and a .env written before task 41 lists no php
      # profile at all. Dropping to one version would silently break every --pNN
      # host that person had.
      - name: an older .env keeps the versions it had
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cp .env /tmp/env.keep
          trap 'cp /tmp/env.keep .env' EXIT
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/' .env

          out="$(forge status)"
          printf '%s\n' "$out" | grep -q 'PHP versions are now picked' \
            || { echo "$out"; echo "no notice printed"; exit 1; }
          grep -q '^COMPOSE_PROFILES=php83,php84,php85$' .env \
            || { grep '^COMPOSE_PROFILES=' .env; exit 1; }

          # and it says it once: the write is the migration
          forge status | grep -q 'PHP versions are now picked' \
            && { echo "the notice repeats"; exit 1; }
          echo "older .env kept its versions"

      # custom/php.d reaches every version; custom/<version>/php.d only its own,
      # and wins where they collide. The trap matters: an .ini left behind would
      # change the memory limit for every step after this one.
      - name: per-version php settings
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Only the files: restarting from a trap would hand the next step a
          # half-started stack, which is exactly what it did the first time.
          # The settings themselves live until the containers are recreated, and
          # no later step asserts a memory limit.
          trap 'rm -f custom/php.d/99-ci.ini custom/8.3/php.d/99-ci.ini' EXIT

          . .github/scripts/serve.sh

          # extends appends to the shared volume list instead of replacing it.
          # The whole design rests on that, so it is asserted directly.
          n="$(COMPOSE_PROFILES='*' docker compose config --format json \
               | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["services"]["php85dev"]["volumes"]))')"
          test "$n" = 5 || { echo "php85dev has $n volumes, expected 5"; exit 1; }

          printf 'memory_limit = 333M\n' > custom/php.d/99-ci.ini
          printf 'memory_limit = 444M\n' > custom/8.3/php.d/99-ci.ini
          forge restart >/dev/null

          for s in php84dev php85dev; do
            got="$(docker compose exec -T "$s" php -r 'echo ini_get("memory_limit");')"
            test "$got" = 333M || { echo "$s: expected the shared 333M, got $got"; exit 1; }
          done
          got="$(docker compose exec -T php83dev php -r 'echo ini_get("memory_limit");')"
          test "$got" = 444M || { echo "php83dev: expected its own 444M, got $got"; exit 1; }

          # and FPM, not just the CLI: the mount is what the request goes through.
          # Retried, because the restart above answers on port 443 before the PHP
          # containers finish their entrypoint -- Apache proxies into that window
          # and returns 503, which is what "started" not meaning "ready" looks like.
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php echo ini_get("memory_limit");' > "$DIR/sites/my-app/limit.php"
          got="$(serve my-app--sites--p83.phpforge.dev limit.php)"
          rm -f "$DIR/sites/my-app/limit.php"
          test "$got" = 444M || { echo "over http: expected 444M, got '$got'"; exit 1; }

          # Put the stack back and wait for it, so the next step does not inherit
          # the restart window this step created.
          rm -f custom/php.d/99-ci.ini custom/8.3/php.d/99-ci.ini
          forge restart >/dev/null
          test -n "$(serve my-app--sites.phpforge.dev '')" \
            || { echo "the stack did not come back"; docker compose ps; exit 1; }

          echo "shared settings shared, per-version settings not"

      # Neither is installed by us any more: the base images already provide them.
      # If that ever stops being true, this catches it instead of a user finding out.
      - name: opcache and mbstring are present in every version
        run: |
          for s in php83dev php84dev php85dev; do
            got="$(docker compose exec -T "$s" php -r 'echo extension_loaded("Zend OPcache") && extension_loaded("mbstring") ? "yes" : "no";')"
            test "$got" = "yes" || { echo "$s: opcache or mbstring missing"; exit 1; }
            len="$(docker compose exec -T "$s" php -r 'echo mb_strlen("ñandú");')"
            test "$len" = "5" || { echo "$s: mbstring not working (got $len)"; exit 1; }
            echo "$s ok"
          done

      # This one leaked source for every request that did not go through
      # DirectoryIndex. Guard it so it cannot come back.
      - name: PHP source is never served as text
        run: |
          for host in my-app--sites my-app--sites--p83 my-app--sites--p99; do
            body="$(curl -sk --resolve $host.phpforge.dev:443:127.0.0.1 \
              https://$host.phpforge.dev/index.php || true)"
            if printf '%s' "$body" | grep -q '<?php'; then
              echo "SOURCE LEAK on $host"; exit 1
            fi
          done
          body="$(curl -s http://127.0.0.1/index.php -H 'Host: my-app--sites.phpforge.dev' || true)"
          printf '%s' "$body" | grep -q '<?php' && { echo "SOURCE LEAK over plain HTTP"; exit 1; }
          echo "no leaks"

      # Files written by the container must belong to the host user, or
      # node_modules cannot be deleted without sudo.
      - name: files created in the container belong to the host user
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php file_put_contents(__DIR__."/written.txt","x");' \
            > "$DIR/projects/my-app/public/write.php"
          curl -fsS --resolve my-app--sites.phpforge.dev:443:127.0.0.1 \
            https://my-app--sites.phpforge.dev/write.php >/dev/null
          owner="$(stat -c %u "$DIR/projects/my-app/public/written.txt")"
          test "$owner" = "$(id -u)" || { echo "owned by $owner, expected $(id -u)"; exit 1; }
          rm -f "$DIR/projects/my-app/public/written.txt"

      # The command this exists for: the hand-written docker exec has to know the
      # container path, the user, that pnpm only lives in a login shell, and that
      # -it must be dropped when nothing is a terminal.
      - name: forge run reaches the project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"

          # No terminal here, which is the case that matters.
          out="$(cd "$DIR/projects/my-app/public" && forge run pwd)"
          test "$out" = "/home/php-devforge/public_html/projects/my-app/public" \
            || { echo "ran in $out"; exit 1; }

          test "$(forge run -C projects/my-app pwd)" \
             = "/home/php-devforge/public_html/projects/my-app" \
            || { echo "-C did not land in the project"; exit 1; }

          # A login shell, or node is missing and it reads like a broken project.
          grep -q '^v' <<<"$(forge run -C projects/my-app node --version)" \
            || { echo "node is not on the PATH"; exit 1; }

          # The exit status is the command's own: a build that fails has to fail.
          if forge run -C projects/my-app false; then echo "exit status swallowed"; exit 1; fi

          forge run -C nope/nowhere pwd 2>/dev/null && { echo "accepted a bad -C"; exit 1; }
          (cd /tmp && forge run pwd 2>/dev/null) && { echo "ran from outside the projects folder"; exit 1; }
          echo "forge run ok"

      # sites/ is a shortcut tried before the full path, and both must keep working.
      - name: short and full paths both resolve
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          forge link "$DIR/projects/my-app/public"
          mkdir -p "$DIR/sites/api/v2"
          printf '<?php echo "nested ok";' > "$DIR/sites/api/v2/index.php"
          . .github/scripts/serve.sh
          # The README now sends new users to the short welcome URL, so it is no
          # longer only the long form that has to answer.
          serves welcome                  "PHP DevForge is running"
          serves welcome                  "Apache"
          serves my-app                   "my-app on PHP"   # sites/ shortcut
          serves v2--api                  "nested ok"       # nested under sites/
          serves public--my-app--projects "my-app on PHP"   # full path still works
          serves my-app--sites            "my-app on PHP"   # long form still works
          # forge link must produce a relative link: an absolute one resolves on the
          # runner but points at nothing inside the containers.
          case "$(readlink "$DIR/sites/my-app")" in
            /*) echo "link is absolute; it will 404 inside the containers"; exit 1 ;;
          esac
          # and it must refuse a folder the containers cannot see
          if forge link /tmp 2>/dev/null; then echo "should have refused /tmp"; exit 1; fi

      # Every Laravel, Symfony and WordPress project is a front controller, and
      # every one of them was broken past its home page: mod_rewrite's per-directory
      # hook runs before ours and leaves "redirect:/index.php" in the file name, so
      # the backend became fcgi://phpNNdev:9000redirect:/index.php and Apache died
      # on a DNS lookup. Found by someone installing a real Laravel app.
      - name: a front controller .htaccess reaches PHP
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          mkdir -p "$DIR/projects/frontctl/public"
          {
            echo '<IfModule mod_rewrite.c>'
            echo '    RewriteEngine On'
            echo '    RewriteCond %{REQUEST_FILENAME} !-d'
            echo '    RewriteCond %{REQUEST_FILENAME} !-f'
            echo '    RewriteRule ^ index.php [L]'
            echo '</IfModule>'
          } > "$DIR/projects/frontctl/public/.htaccess"
          printf '<?php echo "routed: ", $_SERVER["REQUEST_URI"];' \
            > "$DIR/projects/frontctl/public/index.php"
          ln -sfn ../projects/frontctl/public "$DIR/sites/frontctl"

          # "/" always worked: it is a directory, nothing rewrites, and mod_dir's
          # own redirect reaches the fixup with a real file name. The bug showed
          # on everything else.
          host=frontctl--sites.phpforge.dev
          for path in "" "admin" "admin/login" "api/v1/users?x=1"; do
            code="$(curl -fsS -o /tmp/fc.txt -w '%{http_code}' \
                    --resolve "$host:443:127.0.0.1" "https://$host/$path" || true)"
            test "$code" = 200 || { echo "/$path answered $code"; exit 1; }
            grep -q 'routed:' /tmp/fc.txt \
              || { echo "/$path did not reach index.php"; head -3 /tmp/fc.txt; exit 1; }
          done
          echo "front controllers route past the home page"

      # Apache does not forward the Authorization header to FastCGI by itself;
      # php-fpm.conf adds it back. Removing that line breaks every Bearer token
      # and JWT silently, with nothing else looking wrong.
      - name: the Authorization header reaches PHP
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php echo $_SERVER["HTTP_AUTHORIZATION"] ?? "MISSING";' \
            > "$DIR/sites/welcome/auth.php"
          got="$(curl -fsS -H 'Authorization: Bearer ci-token' \
            --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/auth.php)"
          test "$got" = "Bearer ci-token" || { echo "got '$got'"; exit 1; }

      - name: hidden .php files are not served
        run: |
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          printf '<?php echo "should not be reachable";' > "$DIR/sites/welcome/.php"
          code="$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/.php)"
          rm -f "$DIR/sites/welcome/.php"
          test "$code" = "403" || { echo "expected 403, got $code"; exit 1; }

      # Everything above proves the stack works, using curl --resolve. From here
      # the system resolver is configured for real, so a failure below points at
      # setup-local-dns.sh and nothing else.
      - name: configure the system DNS
        run: |
          ./setup-local-dns.sh
          ./setup-local-dns.sh --status

      # Re-running the installer with the stack up used to walk DNS_PORT forward,
      # because the only thing holding the port was our own dnsmasq. With
      # --skip-dns the resolver kept the old number and the domain stopped
      # resolving -- twice on a real machine, once found by someone debugging
      # their browser.
      - name: re-installing does not move the DNS port
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          before="$(sed -ne 's/^DNS_PORT=//p' .env)"
          ./install.sh --yes --skip-dns --skip-cert --skip-link > /tmp/reinstall.log 2>&1
          after="$(sed -ne 's/^DNS_PORT=//p' .env)"
          test "$before" = "$after" \
            || { grep -A3 'free DNS port' /tmp/reinstall.log; echo "moved $before -> $after"; exit 1; }

          # and the three numbers are compared, not merely printed
          forge dns status > /tmp/dns.log 2>&1
          grep -q 'all three agree' /tmp/dns.log || { cat /tmp/dns.log; exit 1; }

          # a disagreement has to be named, or it stays invisible the way it did
          sed -i "s/^DNS_PORT=.*/DNS_PORT=5399/" .env
          forge dns status > /tmp/dns-bad.log 2>&1 || true
          grep -q 'These disagree' /tmp/dns-bad.log || { cat /tmp/dns-bad.log; exit 1; }
          grep -q '5399' /tmp/dns-bad.log && grep -q "$before" /tmp/dns-bad.log \
            || { cat /tmp/dns-bad.log; echo "it did not name both ports"; exit 1; }
          sed -i "s/^DNS_PORT=.*/DNS_PORT=$before/" .env

          echo "the DNS port stays where it was put"

      - name: the domain resolves through the system resolver
        run: |
          got="$(getent hosts welcome--sites.phpforge.dev | awk '{print $1}')"
          test "$got" = "127.0.0.1" || { echo "got '$got', expected 127.0.0.1"; exit 1; }
          # A wildcard, so any subdomain must work without being listed anywhere.
          got="$(getent hosts anything--at--all.phpforge.dev | awk '{print $1}')"
          test "$got" = "127.0.0.1" || { echo "wildcard failed: '$got'"; exit 1; }

      - name: the rest of DNS is untouched
        run: |
          for h in github.com debian.org; do
            got="$(getent hosts $h | awk '{print $1; exit}')"
            test -n "$got" || { echo "$h does not resolve"; exit 1; }
            echo "$h -> $got"
          done

      # The old script wrote Domains=~., sending every query on the machine
      # through the container. Stopping the stack then killed all DNS.
      - name: internet still works with dnsmasq stopped
        run: |
          docker compose stop dnsmasq
          sudo resolvectl flush-caches || true
          for h in github.com debian.org; do
            got="$(getent hosts $h | awk '{print $1; exit}')"
            test -n "$got" || { echo "FAIL: $h stopped resolving"; exit 1; }
          done
          echo "internet survived"
          docker compose start dnsmasq
          sleep 3

      # No --resolve here: this is the path a browser actually takes.
      - name: serve over the real DNS path
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 5 https://welcome--sites.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS https://welcome--sites.phpforge.dev/ > /tmp/dns.txt
          grep -q "PHP DevForge is running" /tmp/dns.txt
          # Same shape as above: these bodies are small enough that the race has
          # never fired, and leaving one instance of the pattern around is how it
          # comes back.
          curl -fsS https://my-app--sites.phpforge.dev/ > /tmp/dns.txt
          grep -q "my-app on PHP 8.4" /tmp/dns.txt
          curl -fsS https://my-app--sites--p83.phpforge.dev/ > /tmp/dns.txt
          grep -q "PHP 8.3" /tmp/dns.txt

      - name: --remove undoes it, with .env already gone
        run: |
          # The cleanup order people actually use: delete .env, then undo the DNS
          # change. Removal must not need config that is already gone.
          mv .env /tmp/env.bak
          ./setup-local-dns.sh --remove
          mv /tmp/env.bak .env
          test ! -f /etc/systemd/resolved.conf.d/50-php-devforge.conf
          getent hosts github.com >/dev/null || { echo "DNS broken after removal"; exit 1; }
          echo "clean"

      # Databases and mail are only useful if PHP can actually reach them, which is
      # a shared-network question rather than a compose-syntax one.
      - name: databases and mail are reachable from PHP
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          forge db on pg18
          forge db on mariadb12
          forge mail on

          # With them running, the welcome page has to show them. Same probe as
          # above, opposite answer -- that is what makes it a probe.
          curl -fsS --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
            https://welcome--sites.phpforge.dev/ > /tmp/welcome2.txt
          grep -q 'mail.phpforge.dev' /tmp/welcome2.txt \
            || { echo "mailpit is up and the page does not link it"; exit 1; }
          grep -q 'postgres18dev:5432' /tmp/welcome2.txt \
            || { echo "pg18 is up and the page does not show it"; exit 1; }
          # Wait for the thing we actually need -- a connection from PHP with the real
          # credentials -- not for a readiness proxy. `mariadb-admin ping` answers on
          # the local socket seconds before the server accepts TCP connections and
          # before the init scripts have created the user, so it reports "alive" while
          # PDO still gets ECONNREFUSED. Same trap as "container running" earlier.
          for i in $(seq 1 60); do
            if docker compose exec -T php84dev php -r '
                 $u = getenv("USER_DEV") ?: "php-devforge"; $p = "php-devforge01";
                 new PDO("pgsql:host=postgres18dev;port=5432;dbname=$u", $u, $p);
                 new PDO("mysql:host=mariadb12dev;port=3306;dbname=$u", $u, $p);' 2>/dev/null; then
              echo "both databases reachable after ${i}s"
              break
            fi
            [ "$i" = 60 ] && { echo "databases never became reachable"; docker compose logs --tail=40 mariadb12dev postgres18dev; exit 1; }
            sleep 2
          done
          # Mail: sent over SMTP from PHP, read back through the web UI.
          docker compose exec -T php84dev php -r '
            $s = fsockopen("mailpit", 1025, $e, $es, 5) or exit(1);
            fgets($s);
            foreach (["EHLO ci","MAIL FROM:<a@ci.test>","RCPT TO:<b@ci.test>","DATA"] as $c) {
                fwrite($s, "$c\r\n"); fgets($s);
            }
            fwrite($s, "Subject: ci-probe\r\n\r\nbody\r\n.\r\n"); fgets($s);
            fwrite($s, "QUIT\r\n");'
          sleep 3
          curl -fsS -k --resolve mail.phpforge.dev:443:127.0.0.1 \
            "https://mail.phpforge.dev/api/v1/messages?limit=5" | grep -q ci-probe
          echo "mail captured and served at mail.<domain>"

      # nginx sat commented out and broken since the first commit precisely because
      # The reported gap: no way to see what can be turned on without opening
      # docker-compose.override.yml. Elasticsearch is listed but deliberately not
      # started -- the task is discoverability, and a 700MB pull buys no signal.
      - name: forge can see and switch every profile
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          forge profile list | tee /tmp/profiles.txt
          for p in mail mariadb11 mariadb12 nginx pg16 pg17 pg18 search tools; do
            grep -qE "^  $p +" /tmp/profiles.txt || { echo "$p is missing"; exit 1; }
          done

          # The ON column must BE COMPOSE_PROFILES, not merely contain a name we
          # guessed: hardcoding one coupled this to where the step sits in the job.
          listed="$(awk '$2=="ON"{print $1}' /tmp/profiles.txt | sort | paste -sd, -)"
          declared="$(sed -ne 's/^COMPOSE_PROFILES=//p' .env | tr ',' '\n' \
                        | grep -v '^$' | sort | paste -sd, -)"
          test "$listed" = "$declared" || {
            echo "listed ON: $listed   .env says: $declared"; exit 1; }
          grep -qE '^  pg16 +off ' /tmp/profiles.txt
          grep -q 'replaces apachedev' /tmp/profiles.txt     # the two exceptions are stated
          grep -q 'used by forge certs' /tmp/profiles.txt
          grep -qE '^  search +off +elasticsearch:[0-9]' /tmp/profiles.txt

          test "$(forge profile list maria | wc -l)" -eq 2

          # off/on through the general command, against a container that is really
          # running by this point, so stopping it is a real assertion.
          # postgres18dev is derived from compose now, not from a pg* -> postgres*dev rule.
          forge profile off pg18
          if docker compose ps --services | grep -qx postgres18dev; then
            echo "postgres18dev did not stop"; exit 1
          fi
          forge profile on pg18
          docker compose ps --services | grep -qx postgres18dev

          # Captured, not piped: forge exits 1 here by design, and under pipefail
          # a pipeline reports the leftmost failure -- so `forge ... | grep` fails
          # even when grep finds what it was looking for.
          out="$(forge profile on tools 2>&1 || true)"
          printf '%s\n' "$out" | grep -q 'forge certs'
          if forge profile on tools >/dev/null 2>&1; then
            echo "a one-shot profile was accepted"; exit 1
          fi
          if forge profile on nope; then echo "unknown profile accepted"; exit 1; fi

          forge db list | grep -q pg18        # the wrapper still works
          echo "every profile is visible and switchable"

      # nothing exercised it. It is an alternative to Apache, not an addition: both
      # want ports 80 and 443.
      # Driven through forge rather than by hand: `profile on nginx` has to stop
      # apachedev, since both publish 80/443, and `off` has to bring it back. That
      # is the one case where turning something on turns something else off.
      - name: the nginx variant serves the same sites
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          docker compose build nginxdev
          forge profile on nginx
          docker compose ps --services | grep -qx nginxdev
          if docker compose ps --services | grep -qx apachedev; then
            echo "apachedev is still up; nginx cannot have the ports"; exit 1
          fi
          for i in $(seq 1 30); do
            curl -fsS --max-time 5 -k --resolve welcome--sites.phpforge.dev:443:127.0.0.1 \
              https://welcome--sites.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          # nginx has its own entrypoint and its own certificate paths, so its
          # healthcheck is verified here rather than assumed from apachedev's.
          state=""
          for _ in $(seq 1 90); do
            state="$(docker inspect --format '{{.State.Health.Status}}' nginxdev)"
            [ "$state" = healthy ] && break
            sleep 1
          done
          test "$state" = healthy || {
            echo "nginxdev never became healthy: $state"
            docker inspect --format '{{json .State.Health}}' nginxdev
            exit 1
          }

          . .github/scripts/serve.sh
          # The welcome page names who served it, which is the point of switching
          serves welcome                "nginx"
          serves my-app--sites          "PHP 8.4"
          serves my-app--sites--p83     "PHP 8.3"
          serves my-app--sites--p85     "PHP 8.5"
          # nginx cannot read .htaccess, so a framework normally 404s on every URL
          # but its home page. The Lua reads the one rule that matters, and the
          # three project types have to keep their own behaviour: an app routes,
          # a static site and a folder of .php pages do not.
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          mkdir -p "$DIR/projects/nfwk/public" "$DIR/projects/nstatic/public" \
                   "$DIR/projects/nspa/public"
          {
            echo 'RewriteEngine On'
            echo 'RewriteCond %{REQUEST_FILENAME} !-d'
            echo 'RewriteCond %{REQUEST_FILENAME} !-f'
            echo 'RewriteRule ^ index.php [L]'
          } > "$DIR/projects/nfwk/public/.htaccess"
          printf '<?php echo "app routed";' > "$DIR/projects/nfwk/public/index.php"
          printf '<h1>static</h1>' > "$DIR/projects/nstatic/public/index.html"
          # A built SPA declares a front controller too, and it is not a .php:
          # index.html has to be served, not handed to php-fpm.
          {
            echo 'RewriteEngine On'
            echo 'RewriteCond %{REQUEST_FILENAME} !-f'
            echo 'RewriteRule ^ index.html [QSA,L]'
          } > "$DIR/projects/nspa/public/.htaccess"
          printf '<h1>spa shell</h1>' > "$DIR/projects/nspa/public/index.html"
          ln -sfn ../projects/nfwk/public "$DIR/sites/nfwk"
          ln -sfn ../projects/nstatic/public "$DIR/sites/nstatic"
          ln -sfn ../projects/nspa/public "$DIR/sites/nspa"

          serves nfwk--sites "app routed"          # / works everywhere; this is the point
          # No -f: the status is the assertion, so curl must not abort on 404 and
          # take the message with it.
          code="$(curl -sk -o /tmp/n.txt -w '%{http_code}' --resolve \
                  nfwk--sites.phpforge.dev:443:127.0.0.1 \
                  https://nfwk--sites.phpforge.dev/admin)"
          test "$code" = 200 || { echo "the framework did not route: /admin answered $code"; exit 1; }
          grep -q 'app routed' /tmp/n.txt || { cat /tmp/n.txt; exit 1; }

          code="$(curl -sk -o /tmp/n.txt -w '%{http_code}' --resolve \
                  nspa--sites.phpforge.dev:443:127.0.0.1 \
                  https://nspa--sites.phpforge.dev/dashboard)"
          test "$code" = 200 || { echo "the SPA did not route: /dashboard answered $code"; exit 1; }
          grep -q 'spa shell' /tmp/n.txt || { cat /tmp/n.txt; exit 1; }

          code="$(curl -sk -o /dev/null -w '%{http_code}' --resolve \
                  nstatic--sites.phpforge.dev:443:127.0.0.1 \
                  https://nstatic--sites.phpforge.dev/admin)"
          test "$code" = 404 || { echo "a static site should 404, answered $code"; exit 1; }
          echo "apps and SPAs route, static sites do not"

          # The Lua sets an unroutable backend when it cannot work out a version, so a
          # .php fails closed instead of being served as a static file.
          for h in my-app--sites my-app--sites--p99; do
            body="$(curl -sk --resolve "$h.phpforge.dev:443:127.0.0.1" "https://$h.phpforge.dev/index.php" || true)"
            printf '%s' "$body" | grep -q '<?php' && { echo "SOURCE LEAK on $h"; exit 1; }
          done
          echo "nginx ok"
          forge profile off nginx
          docker compose ps --services | grep -qx apachedev

      # Neither fallback had ever been exercised: CI runs install_cert.sh first, so
      # the certificate always existed. nginx died outright without one, and
      # Apache's safety net -- written in task 7 -- had never been proven to work.
      - name: a missing certificate degrades instead of killing the server
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/certs-aside
          mv certificates/php-devforge.pem certificates/php-devforge.key /tmp/certs-aside/
          # Unconditional: a failure halfway through would otherwise leave the
          # certificates aside, and every later step -- including the log dump on
          # failure -- would be looking at a degraded stack.
          trap 'mv /tmp/certs-aside/* certificates/ 2>/dev/null || true' EXIT

          # `curl -k` accepts any certificate, so it cannot tell a generated
          # fallback from a stale file. Comparing issuer to subject can: a
          # self-signed certificate signs itself, mkcert's does not. Comparing the
          # two beats grepping for a name -- OpenSSL prints `CN = x` on some builds
          # and `CN=x` on others, which is what broke the first version of this.
          cert_field() {
            echo | openssl s_client -connect 127.0.0.1:443 -servername welcome.phpforge.dev 2>/dev/null \
              | openssl x509 -noout "-$1" | sed "s/^$1=//" | tr -d ' '
          }
          self_signed() { [ "$(cert_field issuer)" = "$(cert_field subject)" ]; }

          docker compose up -d --force-recreate apachedev
          for i in $(seq 1 30); do
            curl -fsS -k --max-time 5 --resolve welcome.phpforge.dev:443:127.0.0.1 \
              https://welcome.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -k --resolve welcome.phpforge.dev:443:127.0.0.1 \
            https://welcome.phpforge.dev/ > /tmp/degraded.txt
          grep -q "PHP DevForge is running" /tmp/degraded.txt
          self_signed || {
            echo "apache is not serving a generated certificate: $(cert_field issuer)"; exit 1; }
          docker compose logs apachedev | grep -qi 'self-signed'
          echo "apache degrades"

          forge profile on nginx
          for i in $(seq 1 30); do
            curl -fsS -k --max-time 5 --resolve welcome.phpforge.dev:443:127.0.0.1 \
              https://welcome.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          docker compose ps --services | grep -qx nginxdev || {
            echo "nginxdev is not running"; docker compose logs --tail=20 nginxdev; exit 1; }
          curl -fsS -k --resolve welcome.phpforge.dev:443:127.0.0.1 \
            https://welcome.phpforge.dev/ > /tmp/degraded.txt
          grep -q "PHP DevForge is running" /tmp/degraded.txt
          self_signed || {
            echo "nginx is not serving a generated certificate: $(cert_field issuer)"; exit 1; }
          echo "nginx degrades too"

          # Put it back, or later steps would be testing the wrong certificate.
          forge profile off nginx
          mv /tmp/certs-aside/php-devforge.pem /tmp/certs-aside/php-devforge.key certificates/
          docker compose up -d --force-recreate apachedev
          for i in $(seq 1 30); do
            curl -fsS --max-time 5 --resolve welcome.phpforge.dev:443:127.0.0.1 \
              https://welcome.phpforge.dev/ >/dev/null 2>&1 && break
            sleep 1
          done
          if self_signed; then echo "the real certificate did not come back"; exit 1; fi
          cert_field issuer | grep -qi mkcert || {
            echo "unexpected issuer after restore: $(cert_field issuer)"; exit 1; }
          echo "and the real one comes back"

      # Every checkout claims the same compose project, so a second one silently
      # adopted and reconfigured the first one's containers. Reproduced rather than
      # described: a real second directory, started from, then taken back.
      - name: a second checkout cannot take over silently
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          HERE="$(pwd)"
          # However this ends, the stack goes back to belonging here: the step
          # after it would otherwise be testing containers from /tmp.
          trap 'cd "$HERE" && forge --force start >/dev/null 2>&1 || true' EXIT

          rm -rf /tmp/second-checkout
          git ls-files | tar -cf - -T - | (mkdir -p /tmp/second-checkout && tar -xf - -C /tmp/second-checkout)
          # A real second clone has only the tracked compose files: any
          # docker-compose.local.yml is gitignored and did not come with it.
          sed -e 's|^PROJECTS_DIR=.*|PROJECTS_DIR=/tmp/second-projects|' \
              -e 's|^COMPOSE_FILE=.*|COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml|' \
              .env > /tmp/second-checkout/.env
          mkdir -p /tmp/second-projects/sites
          (cd /tmp/second-checkout && docker compose up -d)

          owner() {
            docker inspect apachedev \
              --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          }
          test "$(owner)" = /tmp/second-checkout || {
            echo "the second checkout did not take the containers: $(owner)"; exit 1; }

          # no terminal, no --force: it must refuse and say how
          if forge start < /dev/null > /tmp/refused.log 2>&1; then
            echo "forge took over without being asked"; exit 1
          fi
          grep -q /tmp/second-checkout /tmp/refused.log
          grep -q -- --force /tmp/refused.log
          test "$(owner)" = /tmp/second-checkout || { echo "it took over anyway"; exit 1; }

          # status has to be able to answer "who owns these". Captured, not piped:
          # `grep -q` closes the pipe early, forge dies of SIGPIPE, and pipefail
          # reports 141 -- the same trap as `forge profile on tools | grep`.
          forge status > /tmp/status.log 2>&1
          grep -q /tmp/second-checkout /tmp/status.log

          # stop is not destructive, but it is just as surprising
          if forge stop < /dev/null >/dev/null 2>&1; then
            echo "forge stop took over without being asked"; exit 1
          fi

          # and taking over is still one command
          forge --force start < /dev/null > /dev/null 2>&1
          test "$(owner)" = "$HERE" || { echo "--force did not take over: $(owner)"; exit 1; }

          # with no conflict it must say nothing at all
          forge start < /dev/null > /tmp/quiet.log 2>&1
          if grep -q 'started from' /tmp/quiet.log; then
            echo "warned when there was nothing to warn about"; exit 1
          fi

          rm -rf /tmp/second-checkout /tmp/second-projects
          echo "a second checkout announces itself"

      # Last, because it takes the machine apart. A runner is disposable, so the
      # real thing runs here rather than a rehearsal of it -- including the two
      # halves that outlive the checkout: the system CA and the DNS entry.
      - name: uninstall puts the machine back
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          DIR="$(grep '^PROJECTS_DIR=' .env | cut -d= -f2-)"
          CA=/usr/local/share/ca-certificates/php-devforge-ca.crt   # Debian/Ubuntu anchor
          test -f "$CA" || { echo "the CA was never installed; nothing to prove"; exit 1; }

          # --dry-run has to be inspectable and inert
          ./uninstall.sh --dry-run > /tmp/dry.log 2>&1
          grep -q 'would run' /tmp/dry.log || { cat /tmp/dry.log; exit 1; }
          test -f .env && test -f "$CA" || { echo "--dry-run changed something"; exit 1; }

          ./uninstall.sh --yes --volumes

          # containers, volumes, images, network
          left="$(docker ps -a --filter label=com.docker.compose.project=php-devforge -q)"
          test -z "$left" || { docker ps -a; echo "containers left"; exit 1; }
          left="$(docker volume ls --filter label=com.docker.compose.project=php-devforge -q)"
          test -z "$left" || { docker volume ls; echo "volumes left"; exit 1; }
          left="$(docker images -q 'ghcr.io/zelti/php-devforge/*')"
          test -z "$left" || { docker images; echo "images left"; exit 1; }

          # the machine
          test ! -e "$HOME/.local/bin/forge" || { echo "forge still linked"; exit 1; }
          test ! -f /etc/systemd/resolved.conf.d/50-php-devforge.conf \
            || { echo "DNS entry left"; exit 1; }
          test ! -f "$CA" || { echo "CA still trusted"; exit 1; }
          if command -v certutil >/dev/null 2>&1 && [ -d "$HOME/.pki/nssdb" ]; then
            certutil -L -d "sql:$HOME/.pki/nssdb" | grep -q 'PHP DevForge' \
              && { echo "CA still in the browser store"; exit 1; }
          fi

          # the checkout
          test ! -f .env || { echo ".env left"; exit 1; }
          test ! -d .caroot || { echo ".caroot left"; exit 1; }
          test -z "$(find certificates -mindepth 1 ! -name .gitkeep)" \
            || { ls -a certificates; echo "certificates left"; exit 1; }

          # and the one thing a bad flag could destroy
          test -f "$DIR/sites/welcome/index.php" || { echo "IT DELETED THE PROJECTS"; exit 1; }
          test -f docker-compose.local.yml || { echo "it deleted your own override"; exit 1; }

          echo "uninstalled cleanly"

      - name: container logs on failure
        if: failure()
        run: docker compose logs --tail=50
