name: php-devforge

x-logging: &json-logging
  options:
    max-size: "10m"
    max-file: "2"
  driver: "json-file"

x-phpconfig_default: &phpconfig_default
  volumes:
    - dataphp-devforge:/home/php-devforge
    - ${PROJECTS_DIR:-/home/php-devforge/public_html}:/home/php-devforge/public_html
    - ./.caroot:/caroot:ro
    # Drop .ini files in here to change PHP settings. No rebuild needed, and it
    # does not shadow the image's own conf.d, where the Xdebug toggle lives.
    - ./custom/php.d:/usr/local/etc/php/custom.d:ro
  environment:
    - PHP_XDEBUG=${XDEBUG_ENABLE}
    - XDEBUG_IDKEY=${XDEBUG_IDKEY}
    - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/usr/local/etc/php/custom.d
    # Files created in the container end up owned by this uid/gid on the host.
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
  logging: *json-logging

# Images are published to ghcr.io. `docker compose up -d` pulls them, which turns
# a ~15 minute first run into about one.
#
# IMAGE_MODE in .env decides:
#   missing  pull the published image, build only if the pull fails  (default)
#   build    always build locally; the layer cache makes that cheap when nothing
#            changed, and it picks up your Dockerfile edits automatically
#   always   re-pull every time, to force the newest published image

services:
  # Generates the certificates. Not started by `up -d`; run it with:
  #   docker compose run --rm --user "$(id -u):$(id -g)" mkcert
  # The CA is kept in ./.caroot so it survives and stays trusted on the host.
  mkcert:
    build: ./docker-library/mkcert
    image: ghcr.io/zelti/php-devforge/mkcert:dev
    pull_policy: ${IMAGE_MODE:-missing}
    profiles: ["tools"]
    volumes:
      - ./certificates:/certs
      - ./.caroot:/caroot
    working_dir: /certs
    command: >
      -cert-file php-devforge.pem -key-file php-devforge.key
      ${DEV_DOMAIN} *.${DEV_DOMAIN} localhost 127.0.0.1 ::1

  dnsmasq:
    image: andyshinn/dnsmasq
    container_name: dnsmasq
    ports:
      # Listens on localhost only, on a configurable port. Port 53 is usually
      # taken (systemd-resolved, Pi-hole), and which port is free varies per machine.
      - "127.0.0.1:${DNS_PORT:-5354}:53/udp"
    command: --address=/${DEV_DOMAIN}/127.0.0.1 --local=/${DEV_DOMAIN}/
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  apachedev:
    build: ./docker-library/httpd
    image: ghcr.io/zelti/php-devforge/apache:dev
    pull_policy: ${IMAGE_MODE:-missing}
    ports:
      - 80:80
      - 443:443
    depends_on:
      - php${PHP_VERSION}dev
      - dnsmasq
    volumes:
      - dataphp-devforge:/home/php-devforge:ro
      - ./certificates:/etc/apache2/ssl/:ro
      - ${PROJECTS_DIR:-/home/php-devforge/public_html}:/home/php-devforge/public_html
    container_name: apachedev
    hostname: ${USERNAME}-apachedev
    environment:
      - PHP_VERSION=${PHP_VERSION}
      - DEV_DOMAIN=${DEV_DOMAIN}
    logging: *json-logging
    healthcheck:
      test: curl --fail http://localhost || exit 1
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  # nginxdev:
  #   build: ./docker-library/nginx
  #   image: local/nginx:dev
  #   container_name: nginx-dev
  #   hostname: ${USERNAME}-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./certificates:/etc/nginx/ssl/:ro
  #     - dataphp-devforge:/home/php-devforge:ro
  #   environment:
  #     - DEV_DOMAIN=${DEV_DOMAIN}
  #     - PHP_VERSION=${PHP_VERSION}
  #   depends_on:
  #     - php${PHP_VERSION}dev
  #   logging: *json-logging
  #   healthcheck:
  #     test: curl --fail http://localhost || exit 1
  #     interval: 30s
  #     retries: 5
  #     start_period: 10s
  #     timeout: 10s

  php83dev:
    image: ghcr.io/zelti/php-devforge/php:8.3-dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: php83dev
    hostname: ${USERNAME}-php83dev
    build:
      context: ./docker-library/php
      args:
        PHP_TAG: "8.3"
        NODE_VERSION: "${NODE_VERSION}"
    <<: *phpconfig_default

  php84dev:
    image: ghcr.io/zelti/php-devforge/php:8.4-dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: php84dev
    hostname: ${USERNAME}-php84dev
    build:
      context: ./docker-library/php
      args:
        PHP_TAG: "8.4"
        NODE_VERSION: "${NODE_VERSION}"
    <<: *phpconfig_default

  # Adding a version is this block and nothing else: one Dockerfile serves them
  # all, and the vhosts pick the backend from the host name.
  php85dev:
    image: ghcr.io/zelti/php-devforge/php:8.5-dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: php85dev
    hostname: ${USERNAME}-php85dev
    build:
      context: ./docker-library/php
      args:
        PHP_TAG: "8.5"
        NODE_VERSION: "${NODE_VERSION}"
    <<: *phpconfig_default


volumes:
  dataphp-devforge:

networks:
  default:
    name: php-devforge_default
    ipam:
      config:
        - subnet: 172.20.0.0/24
