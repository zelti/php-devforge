name: php-devforge

x-logging: &json-logging
  options:
    max-size: "10m"
    max-file: "2"
  driver: "json-file"

# Images are published to ghcr.io. `docker compose up -d` pulls them, which turns
# a ~15 minute first run into about one.
#
# IMAGE_MODE in .env decides:
#   missing  pull the published image, build only if the pull fails  (default)
#   build    always build locally; the layer cache makes that cheap when nothing
#            changed, and it picks up your Dockerfile edits automatically
#   always   re-pull every time, to force the newest published image

services:
  # Generates the certificates. Not started by `up -d`; run it with:
  #   docker compose run --rm --user "$(id -u):$(id -g)" mkcert
  # The CA is kept in ./.caroot so it survives and stays trusted on the host.
  mkcert:
    build: ./docker-library/mkcert
    image: ghcr.io/zelti/php-devforge/mkcert:dev
    pull_policy: ${IMAGE_MODE:-missing}
    profiles: ["tools"]
    volumes:
      - ./certificates:/certs
      - ./.caroot:/caroot
    working_dir: /certs
    command: >
      -cert-file php-devforge.pem -key-file php-devforge.key
      ${DEV_DOMAIN} *.${DEV_DOMAIN} localhost 127.0.0.1 ::1

  dnsmasq:
    image: andyshinn/dnsmasq
    container_name: dnsmasq
    ports:
      # Listens on localhost only, on a configurable port. Port 53 is usually
      # taken (systemd-resolved, Pi-hole), and which port is free varies per machine.
      - "127.0.0.1:${DNS_PORT:-5354}:53/udp"
    command: --address=/${DEV_DOMAIN}/127.0.0.1 --local=/${DEV_DOMAIN}/
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  apachedev:
    build: ./docker-library/httpd
    image: ghcr.io/zelti/php-devforge/apache:dev
    pull_policy: ${IMAGE_MODE:-missing}
    ports:
      - 80:80
      - 443:443
    depends_on:
      - dnsmasq
    volumes:
      - dataphp-devforge:/home/php-devforge:ro
      - ./certificates:/etc/apache2/ssl/:ro
      - ${PROJECTS_DIR:-/home/php-devforge/public_html}:/home/php-devforge/public_html
    container_name: apachedev
    hostname: ${USERNAME}-apachedev
    environment:
      - PHP_VERSION=${PHP_VERSION}
      - DEV_DOMAIN=${DEV_DOMAIN}
      # The setting itself, not a copy of it: resolve_docroot.lua answers a request
      # for a version that is not installed, and a second list would drift.
      - ENABLED_PROFILES=${COMPOSE_PROFILES:-}
    logging: *json-logging
    healthcheck:
      test: curl --fail http://localhost || exit 1
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  # nginx, via OpenResty. Apache is the default; this is an alternative, not an
  # addition -- both want ports 80 and 443, so stop one before starting the other:
  #
  #   docker compose stop apachedev
  #   docker compose --profile nginx up -d nginxdev
  #
  # OpenResty rather than plain nginx: the document root and the PHP backend come
  # from the host name in Lua, which stock nginx cannot do.
  #
  # No .htaccess here: the Lua reads the front-controller rule out of it so that
  # frameworks route, and nothing else in the file applies. That is still the
  # reason Apache is the default.
  nginxdev:
    profiles: ["nginx"]
    build: ./docker-library/nginx
    image: ghcr.io/zelti/php-devforge/nginx:dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: nginxdev
    hostname: ${USERNAME}-nginxdev
    ports:
      - 80:80
      - 443:443
    volumes:
      - dataphp-devforge:/home/php-devforge:ro
      - ./certificates:/etc/nginx/ssl/:ro
      - ${PROJECTS_DIR:-/home/php-devforge/public_html}:/home/php-devforge/public_html
    environment:
      - DEV_DOMAIN=${DEV_DOMAIN}
      - PHP_VERSION=${PHP_VERSION}
      - ENABLED_PROFILES=${COMPOSE_PROFILES:-}
      - NGINX_FRONT_CONTROLLER=${NGINX_FRONT_CONTROLLER:-auto}
    depends_on:
      - dnsmasq
    logging: *json-logging
    healthcheck:
      test: curl --fail http://localhost || exit 1
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  # One profile per version: each image is about 2 GB, so nothing is installed
  # unless it is picked. Everything they share lives in php-base.yml. COMPOSE_PROFILES always carries the default version --
  # install.sh writes it, `forge php off` refuses to remove it.
  #
  # No `depends_on` on the web servers: compose refuses to parse a project whose
  # dependency sits behind a disabled profile, and the backend is resolved per
  # request anyway (resolve_docroot.lua).
  php83dev:
    extends:
      file: php-base.yml
      service: php
    profiles: ["php83"]
    image: ghcr.io/zelti/php-devforge/php:8.3-dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: php83dev
    hostname: ${USERNAME}-php83dev
    build:
      context: ./docker-library/php
      args:
        PHP_TAG: "8.3"
        NODE_VERSION: "${NODE_VERSION}"
    # The only per-version line. extends appends to the shared list above.
    volumes:
      - ./custom/8.3:/usr/local/etc/php/version:ro
    logging: *json-logging

  php84dev:
    extends:
      file: php-base.yml
      service: php
    profiles: ["php84"]
    image: ghcr.io/zelti/php-devforge/php:8.4-dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: php84dev
    hostname: ${USERNAME}-php84dev
    build:
      context: ./docker-library/php
      args:
        PHP_TAG: "8.4"
        NODE_VERSION: "${NODE_VERSION}"
    # The only per-version line. extends appends to the shared list above.
    volumes:
      - ./custom/8.4:/usr/local/etc/php/version:ro
    logging: *json-logging

  # Adding a version is this block and nothing else: one Dockerfile serves them
  # all, the vhosts pick the backend from the host name, and forge creates the
  # custom/<version> folder on the next start.
  php85dev:
    extends:
      file: php-base.yml
      service: php
    profiles: ["php85"]
    image: ghcr.io/zelti/php-devforge/php:8.5-dev
    pull_policy: ${IMAGE_MODE:-missing}
    container_name: php85dev
    hostname: ${USERNAME}-php85dev
    build:
      context: ./docker-library/php
      args:
        PHP_TAG: "8.5"
        NODE_VERSION: "${NODE_VERSION}"
    # The only per-version line. extends appends to the shared list above.
    volumes:
      - ./custom/8.5:/usr/local/etc/php/version:ro
    logging: *json-logging


volumes:
  dataphp-devforge:

networks:
  default:
    name: php-devforge_default
    ipam:
      config:
        - subnet: 172.20.0.0/24
