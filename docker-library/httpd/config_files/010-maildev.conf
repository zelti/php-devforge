# Serves the mail catcher's UI at maildev.<domain>.
#
# A dedicated vhost, and the 010- prefix matters. Apache picks the FIRST vhost whose
# ServerName or ServerAlias matches, in load order -- not the most specific one. With
# a plain name this loaded after devlocal_https.conf, whose ServerAlias *.${DEV_DOMAIN}
# swallowed maildev.<domain> and handed it to the Lua, which looked for a folder named
# maildev and returned 404.
#
# Present even when the mail profile is off, in which case it returns 503. That is
# clearer than the alternative, which would map maildev.<domain> to a folder that
# does not exist and return a confusing 404.
<VirtualHost *:443>
        ServerName maildev.${DEV_DOMAIN}

        SSLEngine ON
        <IfFile /etc/apache2/ssl/php-devforge.pem>
                SSLCertificateFile /etc/apache2/ssl/php-devforge.pem
                SSLCertificateKeyFile /etc/apache2/ssl/php-devforge.key
        </IfFile>
        <IfFile !/etc/apache2/ssl/php-devforge.pem>
                SSLCertificateFile /etc/apache2/ssl-fallback/fallback.pem
                SSLCertificateKeyFile /etc/apache2/ssl-fallback/fallback.key
        </IfFile>

        ProxyPreserveHost On
        ProxyPass        / http://maildev:8025/
        ProxyPassReverse / http://maildev:8025/

        # Mailpit pushes new messages over a websocket.
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) "ws://maildev:8025/$1" [P,L]
</VirtualHost>

<VirtualHost *:80>
        ServerName maildev.${DEV_DOMAIN}
        ProxyPreserveHost On
        ProxyPass        / http://maildev:8025/
        ProxyPassReverse / http://maildev:8025/
</VirtualHost>
