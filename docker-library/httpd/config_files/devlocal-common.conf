# Shared by devlocal.conf (:80) and devlocal_https.conf (:443), which differ only
# in the port and the TLS block. Included inside <VirtualHost>, so only
# directives valid in that context belong here.
#
# mod_lua is required, not optional: it resolves both the document root and the
# PHP backend. If it is missing Apache will not start, and that is deliberate --
# a running Apache with no PHP handler serves .php files as plain text.

ServerAdmin php-devforge@example.com

ServerName ${DEV_DOMAIN}
ServerAlias *.${DEV_DOMAIN}

# Only a fallback: resolve_docroot.lua replaces this per request, deriving the
# folder from the host name.
DocumentRoot /var/www/
LuaHookTranslateName "/etc/apache2/lua/resolve_docroot.lua" silly_mapper

# PHP-FPM backend chosen in resolve_docroot.lua (set_php_handler):
# host --pNN wins, else PHP_VERSION from .env. New versions need no change here.
LuaHookFixups "/etc/apache2/lua/resolve_docroot.lua" set_php_handler

<IfModule mod_dir.c>
        DirectoryIndex index.html index.cgi index.pl index.php index.xhtml index.htm
</IfModule>

# Websocket config
#RewriteCond %{HTTP:Upgrade} websocket [NC]
#RewriteCond %{HTTP:Connection} upgrade [NC]
#RewriteRule ^/?(.*) "ws://phpwebsocket:8080/$1" [P,L]

<Directory /home/php-devforge/public_html/>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
</Directory>
