<VirtualHost *:443>
        ServerAdmin php-devforge@example.com

        ServerName ${DEV_DOMAIN}
        ServerAlias *.${DEV_DOMAIN}
        
        Define DEFAULT_DOCUMENT_ROOT /var/www/
        
        SSLEngine ON
        # Real certificate from ./install_cert.sh
        <IfFile /etc/apache2/ssl/php-devforge.pem>
                SSLCertificateFile /etc/apache2/ssl/php-devforge.pem
                SSLCertificateKeyFile /etc/apache2/ssl/php-devforge.key
        </IfFile>

        # Otherwise the entrypoint generated a temporary self-signed one
        <IfFile !/etc/apache2/ssl/php-devforge.pem>
                SSLCertificateFile /etc/apache2/ssl-fallback/fallback.pem
                SSLCertificateKeyFile /etc/apache2/ssl-fallback/fallback.key
        </IfFile>

        <IfModule mod_lua.c>
                DocumentRoot ${DEFAULT_DOCUMENT_ROOT}

                LuaHookTranslateName "/etc/apache2/lua/resolve_docroot.lua" silly_mapper
        </IfModule>

        <IfModule !mod_lua.c>
                DocumentRoot ${DEFAULT_DOCUMENT_ROOT}
        </IfModule>      


        <IfModule mod_dir.c>
                DirectoryIndex index.html index.cgi index.pl index.php index.xhtml index.htm
        </IfModule>

    
        # Websocket config
        #RewriteCond %{HTTP:Upgrade} websocket [NC]
        #RewriteCond %{HTTP:Connection} upgrade [NC]
        #RewriteRule ^/?(.*) "ws://phpwebsocket:8080/$1" [P,L]

        # PHP-FPM backend chosen in resolve_docroot.lua (set_php_handler):
        # host --pNN wins, else PHP_VERSION from .env. New versions need no change here.
        # Left outside <IfModule> on purpose: without mod_lua there is no PHP handler.
        LuaHookFixups "/etc/apache2/lua/resolve_docroot.lua" set_php_handler

        <Directory /home/php-devforge/public_html/>
                Options FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>

</VirtualHost>