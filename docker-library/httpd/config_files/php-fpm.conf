# Deny access to hidden files like ".php" or ".phtml", which would otherwise be
# served or executed.
<FilesMatch "^\.ph(p[345]?|t|tml|ps)$">
    Require all denied
</FilesMatch>

<IfModule proxy_fcgi_module>
  # Apache does not pass the Authorization header to FastCGI on its own, so
  # Bearer tokens, JWT and Laravel Sanctum would all arrive empty in PHP.
  # Verified: commenting this line out makes $_SERVER['HTTP_AUTHORIZATION']
  # disappear. Do not remove it.
  <IfModule setenvif_module>
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
  </IfModule>
</IfModule>
