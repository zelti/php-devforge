zend_extension = xdebug
[xdebug]
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.discover_client_host = false
xdebug.client_host = IPGATEWAY
; 9003 is the Xdebug 3 default. Not 9000: that is where php-fpm listens.
xdebug.client_port = 9003
;xdebug.log = /tmp/xdebug.log
; (xdebug.remote_handler was Xdebug 2 only; Xdebug 3 ignores it)
xdebug.idekey = IDKEY