; Mounted by php-base.yml and read right after the image's own conf.d, so
; custom/php.d and custom/<version>/php.d still win: a project that sets its
; own auto_prepend_file there replaces this one (PHP takes only one), and then
; its pages are served through a tunnel without the URL rewrite.
;
; The script does nothing unless the web server marked the request as coming
; through `forge tunnel` -- every local request, and every CLI run, skip it.
auto_prepend_file = /usr/local/etc/php/forge.d/tunnel-prepend.php
